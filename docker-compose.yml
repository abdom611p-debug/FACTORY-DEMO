# Local full stack:  docker compose up --build   →  UI http://localhost:8080/console.html  ·  AI http://localhost:8765/docs
services:
  platform:
    build: ./platform
    container_name: egic-platform
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - platform_data:/data

  ai-engine:
    build: .
    container_name: egic-ai-engine
    ports:
      - "8765:8000"
    environment:
      - EGIC_PLATFORM_URL=http://platform:8080
      - PRELOAD_MODELS=true
    depends_on:
      - platform

volumes:
  platform_data:
